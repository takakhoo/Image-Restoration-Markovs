name: Reproduce MRF restoration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-reproduce.txt
      - run: python -m unittest -v
      - run: python experiment.py --output /tmp/mrf-results
      - uses: actions/upload-artifact@v4
        with:
          name: mrf-results
          path: /tmp/mrf-results
